apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: subscription-service
  title: Subscription Entitlements
  description: >-
    Owns active or suspended commercial entitlement. A valid tenant is not necessarily entitled to a
    workspace.
  annotations:
    jira/project-key: ACT
    acmesecure.example/jira-label: subscription-service
    backstage.io/techdocs-ref: dir:.
    acmesecure.example/http-method: GET
    acmesecure.example/http-route: /v1/subscriptions/{tenantID}
    acmesecure.example/http-port: '8082'
    acmesecure.example/support-tier: 'L1: Service Desk; L2: Commerce'
  links:
    - url: http://localhost:3000/delivery?component=subscription-service&source=scenario
      title: Jira handover example (fictional)
      icon: dashboard
    - url: http://localhost:8082/healthz
      title: Process health (local)
      icon: dashboard
    - url: http://localhost:3000/docs/default/component/subscription-service/runbook
      title: L1 / L2 runbook
      icon: docs
    - url: http://localhost:3000/docs/default/component/subscription-service/qa
      title: QA and release handover
      icon: docs
  tags:
    - python
    - fastapi
    - poc
    - commerce
spec:
  type: service
  lifecycle: experimental
  owner: group:default/commerce
  system: customer-activation
  providesApis:
    - subscription-service-api
  consumesApis:
    - tenant-service-api
  dependsOn:
    - component:default/tenant-service
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: subscription-service-api
  title: Subscription Entitlements API
  description: GET /v1/subscriptions/{tenantID} — deterministic local fixture.
spec:
  type: openapi
  lifecycle: experimental
  owner: group:default/commerce
  system: customer-activation
  definition: |
    openapi: 3.1.0
    info:
      title: Subscription Entitlements API
      version: 1.0.0
    servers:
    - url: http://localhost:8082
    paths:
      /v1/subscriptions/{tenantID}:
        get:
          summary: Subscription Entitlements preview
          operationId: subscriptionserviceLookup
          parameters:
          - name: tenantID
            in: path
            required: true
            schema:
              type: string
              pattern: ^[a-zA-Z0-9-]{1,64}$
              title: Tenantid
          - name: X-Request-ID
            in: header
            required: false
            schema:
              anyOf:
              - type: string
              - type: 'null'
              description: Forwarded across service boundaries. Invalid or absent IDs
                are replaced.
              title: X-Request-Id
            description: Forwarded across service boundaries. Invalid or absent IDs are
              replaced.
          responses:
            '200':
              description: Successful Response
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Success_Result_'
              headers:
                X-Request-ID:
                  schema:
                    type: string
                  description: Correlation ID forwarded across service boundaries
            '400':
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Failure'
              description: Bad Request
              headers:
                X-Request-ID:
                  schema:
                    type: string
                  description: Correlation ID forwarded across service boundaries
            '502':
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Failure'
              description: Bad Gateway
              headers:
                X-Request-ID:
                  schema:
                    type: string
                  description: Correlation ID forwarded across service boundaries
            '409':
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Failure'
              description: Conflict
              headers:
                X-Request-ID:
                  schema:
                    type: string
                  description: Correlation ID forwarded across service boundaries
    components:
      schemas:
        Cause:
          properties:
            service:
              type: string
              title: Service
            owner:
              type: string
              title: Owner
            code:
              type: string
              title: Code
          additionalProperties: false
          type: object
          required:
          - service
          - owner
          - code
          title: Cause
        Failure:
          properties:
            error:
              type: string
              title: Error
            request_id:
              type: string
              title: Request Id
            root_cause:
              $ref: '#/components/schemas/Cause'
            failed_dependency:
              anyOf:
              - type: string
              - type: 'null'
              title: Failed Dependency
          additionalProperties: false
          type: object
          required:
          - error
          - request_id
          - root_cause
          title: Failure
        Result:
          properties:
            plan:
              type: string
              title: Plan
            entitlement:
              type: string
              const: active
              title: Entitlement
            workspace_limit:
              type: integer
              title: Workspace Limit
          additionalProperties: false
          type: object
          required:
          - plan
          - entitlement
          - workspace_limit
          title: Result
        Success_Result_:
          properties:
            service:
              type: string
              title: Service
            owner:
              type: string
              title: Owner
            request_id:
              type: string
              title: Request Id
            tenant_id:
              type: string
              title: Tenant Id
            checked_dependencies:
              items:
                type: string
              type: array
              title: Checked Dependencies
            result:
              $ref: '#/components/schemas/Result'
            simulation:
              type: boolean
              const: true
              title: Simulation
          additionalProperties: false
          type: object
          required:
          - service
          - owner
          - request_id
          - tenant_id
          - checked_dependencies
          - result
          - simulation
          title: Success[Result]
