apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: notification-service
  title: Customer Notifications
  description: >-
    Owns welcome content and delivery routing. Contact is read from Identity. This POC previews
    delivery without sending email.
  annotations:
    backstage.io/techdocs-ref: dir:.
    acmesecure.example/http-method: GET
    acmesecure.example/http-route: /v1/notices/{tenantID}
    acmesecure.example/http-port: '8085'
    acmesecure.example/support-tier: 'L1: Service Desk; L2: Customer Experience'
  links:
    - url: http://localhost:8085/healthz
      title: Process health (local)
      icon: dashboard
    - url: http://localhost:3000/docs/default/component/notification-service/runbook
      title: L1 / L2 runbook
      icon: docs
    - url: http://localhost:3000/docs/default/component/notification-service/qa
      title: QA and release handover
      icon: docs
  tags:
    - python
    - fastapi
    - poc
    - customer-experience
spec:
  type: service
  lifecycle: experimental
  owner: group:default/customer-experience
  system: customer-activation
  providesApis:
    - notification-service-api
  consumesApis:
    - tenant-service-api
  dependsOn:
    - component:default/tenant-service
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: notification-service-api
  title: Customer Notifications API
  description: GET /v1/notices/{tenantID} — deterministic local fixture.
spec:
  type: openapi
  lifecycle: experimental
  owner: group:default/customer-experience
  system: customer-activation
  definition: |
    openapi: 3.1.0
    info:
      title: Customer Notifications API
      version: 1.0.0
    servers:
    - url: http://localhost:8085
    paths:
      /v1/notices/{tenantID}:
        get:
          summary: Customer Notifications preview
          operationId: notificationserviceLookup
          parameters:
          - name: tenantID
            in: path
            required: true
            schema:
              type: string
              pattern: ^[a-zA-Z0-9-]{1,64}$
              title: Tenantid
          - name: X-Request-ID
            in: header
            required: false
            schema:
              anyOf:
              - type: string
              - type: 'null'
              description: Forwarded across service boundaries. Invalid or absent IDs
                are replaced.
              title: X-Request-Id
            description: Forwarded across service boundaries. Invalid or absent IDs are
              replaced.
          responses:
            '200':
              description: Successful Response
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Success_Result_'
              headers:
                X-Request-ID:
                  schema:
                    type: string
                  description: Correlation ID forwarded across service boundaries
            '400':
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Failure'
              description: Bad Request
              headers:
                X-Request-ID:
                  schema:
                    type: string
                  description: Correlation ID forwarded across service boundaries
            '502':
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Failure'
              description: Bad Gateway
              headers:
                X-Request-ID:
                  schema:
                    type: string
                  description: Correlation ID forwarded across service boundaries
    components:
      schemas:
        Cause:
          properties:
            service:
              type: string
              title: Service
            owner:
              type: string
              title: Owner
            code:
              type: string
              title: Code
          additionalProperties: false
          type: object
          required:
          - service
          - owner
          - code
          title: Cause
        Failure:
          properties:
            error:
              type: string
              title: Error
            request_id:
              type: string
              title: Request Id
            root_cause:
              $ref: '#/components/schemas/Cause'
            failed_dependency:
              anyOf:
              - type: string
              - type: 'null'
              title: Failed Dependency
          additionalProperties: false
          type: object
          required:
          - error
          - request_id
          - root_cause
          title: Failure
        Result:
          properties:
            template:
              type: string
              title: Template
            delivery:
              type: string
              const: preview-only
              title: Delivery
            recipient_source:
              type: string
              const: tenant-service
              title: Recipient Source
          additionalProperties: false
          type: object
          required:
          - template
          - delivery
          - recipient_source
          title: Result
        Success_Result_:
          properties:
            service:
              type: string
              title: Service
            owner:
              type: string
              title: Owner
            request_id:
              type: string
              title: Request Id
            tenant_id:
              type: string
              title: Tenant Id
            checked_dependencies:
              items:
                type: string
              type: array
              title: Checked Dependencies
            result:
              $ref: '#/components/schemas/Result'
            simulation:
              type: boolean
              const: true
              title: Simulation
          additionalProperties: false
          type: object
          required:
          - service
          - owner
          - request_id
          - tenant_id
          - checked_dependencies
          - result
          - simulation
          title: Success[Result]
