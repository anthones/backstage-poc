<title id="title">Customer Portal and six services across four teams</title><desc id="desc">Customer Portal calls Activation and Subscription. Activation calls Tenant, Subscription, Policy, Provisioning, and Notifications. Provisioning calls Policy and Subscription. Policy, Subscription, and Notifications call Tenant. Twelve arrows point from caller to provider.</desc>
