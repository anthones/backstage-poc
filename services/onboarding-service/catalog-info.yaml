apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: onboarding-service
  title: Customer Activation
  description: >-
    Owns activation coordination and customer-visible outcome. Delegates identity, entitlement,
    policy, workspace, and notice decisions.
  annotations:
    jira/project-key: ACT
    acmesecure.example/jira-label: onboarding-service
    backstage.io/techdocs-ref: dir:.
    acmesecure.example/http-method: POST
    acmesecure.example/http-route: /v1/activations
    acmesecure.example/http-port: '8086'
    acmesecure.example/support-tier: 'L1: Service Desk; L2: Customer Experience'
  links:
    - url: http://localhost:3000/delivery?component=onboarding-service&source=scenario
      title: Jira handover example (fictional)
      icon: dashboard
    - url: http://localhost:8086/healthz
      title: Process health (local)
      icon: dashboard
    - url: http://localhost:3000/docs/default/component/onboarding-service/runbook
      title: L1 / L2 runbook
      icon: docs
    - url: http://localhost:3000/docs/default/component/onboarding-service/qa
      title: QA and release handover
      icon: docs
  tags:
    - python
    - fastapi
    - poc
    - customer-experience
spec:
  type: service
  lifecycle: experimental
  owner: group:default/customer-experience
  system: customer-activation
  providesApis:
    - onboarding-service-api
  consumesApis:
    - tenant-service-api
    - subscription-service-api
    - policy-service-api
    - provisioning-service-api
    - notification-service-api
  dependsOn:
    - component:default/tenant-service
    - component:default/subscription-service
    - component:default/policy-service
    - component:default/provisioning-service
    - component:default/notification-service
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: onboarding-service-api
  title: Customer Activation API
  description: POST /v1/activations — deterministic local fixture.
spec:
  type: openapi
  lifecycle: experimental
  owner: group:default/customer-experience
  system: customer-activation
  definition: |
    openapi: 3.1.0
    info:
      title: Customer Activation API
      version: 1.0.0
    servers:
    - url: http://localhost:8086
    paths:
      /v1/activations:
        post:
          summary: Customer Activation preview
          operationId: onboardingserviceLookup
          parameters:
          - name: X-Request-ID
            in: header
            required: false
            schema:
              anyOf:
              - type: string
              - type: 'null'
              description: Forwarded across service boundaries. Invalid or absent IDs
                are replaced.
              title: X-Request-Id
            description: Forwarded across service boundaries. Invalid or absent IDs are
              replaced.
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ActivationRequest'
          responses:
            '200':
              description: Successful Response
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Success_Result_'
              headers:
                X-Request-ID:
                  schema:
                    type: string
                  description: Correlation ID forwarded across service boundaries
            '400':
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Failure'
              description: Bad Request
              headers:
                X-Request-ID:
                  schema:
                    type: string
                  description: Correlation ID forwarded across service boundaries
            '502':
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Failure'
              description: Bad Gateway
              headers:
                X-Request-ID:
                  schema:
                    type: string
                  description: Correlation ID forwarded across service boundaries
    components:
      schemas:
        ActivationRequest:
          properties:
            tenant_id:
              type: string
              pattern: ^[a-zA-Z0-9-]{1,64}$
              title: Tenant Id
          additionalProperties: false
          type: object
          required:
          - tenant_id
          title: ActivationRequest
        Cause:
          properties:
            service:
              type: string
              title: Service
            owner:
              type: string
              title: Owner
            code:
              type: string
              title: Code
          additionalProperties: false
          type: object
          required:
          - service
          - owner
          - code
          title: Cause
        Failure:
          properties:
            error:
              type: string
              title: Error
            request_id:
              type: string
              title: Request Id
            root_cause:
              $ref: '#/components/schemas/Cause'
            failed_dependency:
              anyOf:
              - type: string
              - type: 'null'
              title: Failed Dependency
          additionalProperties: false
          type: object
          required:
          - error
          - request_id
          - root_cause
          title: Failure
        Result:
          properties:
            activation:
              type: string
              const: ready
              title: Activation
            message:
              type: string
              title: Message
          additionalProperties: false
          type: object
          required:
          - activation
          - message
          title: Result
        Success_Result_:
          properties:
            service:
              type: string
              title: Service
            owner:
              type: string
              title: Owner
            request_id:
              type: string
              title: Request Id
            tenant_id:
              type: string
              title: Tenant Id
            checked_dependencies:
              items:
                type: string
              type: array
              title: Checked Dependencies
            result:
              $ref: '#/components/schemas/Result'
            simulation:
              type: boolean
              const: true
              title: Simulation
          additionalProperties: false
          type: object
          required:
          - service
          - owner
          - request_id
          - tenant_id
          - checked_dependencies
          - result
          - simulation
          title: Success[Result]
