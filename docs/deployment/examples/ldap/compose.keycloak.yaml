# Independent identity stack. Install as /srv/acme-identity/compose.yaml.
services:
  database:
    image: postgres:17-trixie
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_DB: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U keycloak -d keycloak']
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 512m
    restart: unless-stopped
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ['start']
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://database:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_ORIGIN:?Set KEYCLOAK_ORIGIN}
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: 'true'
      KC_BOOTSTRAP_ADMIN_USERNAME: bootstrap-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_PASSWORD:?Set KEYCLOAK_BOOTSTRAP_PASSWORD}
    ports:
      - 127.0.0.1:8180:8080
    volumes:
      - /etc/acme-identity/truststores:/opt/keycloak/conf/truststores:ro
    depends_on:
      database:
        condition: service_healthy
    init: true
    mem_limit: 2g
    restart: unless-stopped
volumes:
  keycloak-data:
