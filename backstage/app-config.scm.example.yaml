# Example only: replace host, paths, and credentials for the company's internal SCM.
# Apply alongside app-config.yaml after the six service folders become real repositories.
# This replaces local locations. Each repo's CI still publishes its TechDocs artifact.
integrations:
  gitlab:
    - host: gitlab.acmesecure.example
      apiBaseUrl: https://gitlab.acmesecure.example/api/v4
      token: ${GITLAB_TOKEN}

catalog:
  processingInterval: { minutes: 5 }
  locations:
    - type: file
      target: ../../../catalog/all.yaml
    - type: url
      target: https://gitlab.acmesecure.example/identity/tenant-service/-/blob/main/catalog-info.yaml
    - type: url
      target: https://gitlab.acmesecure.example/commerce/subscription-service/-/blob/main/catalog-info.yaml
    - type: url
      target: https://gitlab.acmesecure.example/cloud-security/policy-service/-/blob/main/catalog-info.yaml
    - type: url
      target: https://gitlab.acmesecure.example/cloud-security/provisioning-service/-/blob/main/catalog-info.yaml
    - type: url
      target: https://gitlab.acmesecure.example/customer-experience/notification-service/-/blob/main/catalog-info.yaml
    - type: url
      target: https://gitlab.acmesecure.example/customer-experience/onboarding-service/-/blob/main/catalog-info.yaml
